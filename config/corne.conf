# Mouse functionality disabled for this version.
CONFIG_ZMK_POINTING=n

# Standard Corne WS2812 chain, configured for 27 LEDs per half in rgb.h.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Keep shared VCC powered when RGB is off: OLEDs may use the same rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Standard Corne I2C SSD1306 128x32 OLED on each half.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Shared activity timeout for OLED blanking and RGB auto-off (milliseconds).
CONFIG_ZMK_IDLE_TIMEOUT=10000
